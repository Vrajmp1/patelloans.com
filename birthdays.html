<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfe6ff">
  <title>Satsang Birthdays</title>
  <link rel="stylesheet" href="style1.css?v=4">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <h1><span id="year-title">2026</span> Satsang Birthdays</h1>
    </header>

    <nav class="mode-switch" aria-label="Calendar mode">
      <a href="Ekadashi-Reminders.html">Upvaas</a>
      <span class="active" aria-current="page">Birthdays</span>
    </nav>

    <section class="event-card" id="birthday-card" aria-label="Selected birthday">
      <div class="month-row">
        <h2 id="month-value" class="month-value">September</h2>
        <span class="year-chip" id="birthday-year-chip">2026</span>
      </div>

      <div class="event-visual">
        <div class="date-tile" aria-label="Birthday date">
          <span id="date-value">23</span>
          <small>Birthday</small>
        </div>
        <div class="image-frame">
          <img id="card-img" alt="Birthday portrait">
        </div>
      </div>

      <div class="event-copy">
        <h3 id="type-value">Loading birthday…</h3>
        <p id="day-value">Wednesday</p>
      </div>

      <div class="card-controls" aria-label="Browse birthdays">
        <button type="button" onclick="previous()" aria-label="Previous birthday">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <span>Swipe or tap</span>
        <button type="button" onclick="forward()" aria-label="Next birthday">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg>
        </button>
      </div>
    </section>

    <section class="countdown-card" aria-live="polite">
      <span>Countdown</span>
      <strong id="days-remaining">—</strong>
    </section>

    <section class="stats-grid">
      <article class="info-card">
        <span class="info-label">Current Age</span>
        <strong id="age-value"><span id="yr-age">—</span> years, <span id="mon-age">—</span> months, <span id="day-age">—</span> days</strong>
      </article>
      <article class="info-card">
        <span class="info-label">Age on this birthday</span>
        <strong id="then-age-value-p"><span id="then-age-value">—</span> years</strong>
      </article>
    </section>

    <section class="panel compact-panel">
      <div class="panel-heading"><h2>Go to a date</h2></div>
      <div class="go-to-row">
        <input type="date" id="go-to-date" min="1950-12-26" aria-label="Go to date">
        <button type="button" class="primary-button" onclick="go()">Go</button>
      </div>
    </section>

    <section class="panel compact-panel audio-panel">
      <div class="panel-heading"><h2>Dada Sattu</h2></div>
      <audio id="myAudio" controls preload="none"><source src="Dada Sattu.mp3"></audio>
    </section>

    <p class="today-line">Today is <strong><span id="cur-day">—</span> <span id="cur-mon">—</span>, <span id="cur-yr">—</span></strong></p>

    <section class="panel">
      <div class="panel-heading"><h2>Age Difference</h2></div>
      <div class="calculator-grid">
        <label><span>Person 1</span><select name="names1" id="names1"><option value="">Choose a person</option></select></label>
        <label><span>Person 2</span><select name="names2" id="names2"><option value="">Choose a person</option></select></label>
      </div>
      <button id="calculate" type="button" class="primary-button full-button" onclick="calculate()">Calculate difference</button>
      <div class="result-box" aria-live="polite"><strong id="older"></strong><span id="diff-age"></span></div>
    </section>

    <section class="panel request-panel">
      <div class="panel-heading"><h2>Request an Addition</h2></div>
      <form id="birthday-request-form" class="birthday-request-form" onsubmit="Submit(event)">
        <label><span>Name</span><input id="request-name" name="request_name" type="text" autocomplete="name" placeholder="Full name" required></label>
        <label><span>Birthday</span><input id="request-bday" name="request_birthday" type="date" required></label>
        <label><span>Email</span><input id="request-email" name="request_email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <button id="submit" type="submit" class="primary-button full-button">Send request</button>
        <p id="request-status" class="request-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="script1.js?v=5"></script>
</body>
</html>
