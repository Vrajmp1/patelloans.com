<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0a8">
  <title>Ekadashi Dates</title>
  <link rel="stylesheet" href="styleE.css?v=4">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <h1><span id="cur-yr-title">2026</span> Ekadashi Dates</h1>
    </header>

    <nav class="mode-switch" aria-label="Calendar mode">
      <span class="active" aria-current="page">Upvaas</span>
      <a href="birthdays.html">Birthdays</a>
    </nav>

    <section class="event-card" id="ekadashi-card" aria-label="Selected Ekadashi or utsav">
      <div class="month-row">
        <h2 id="month-value" class="month-value">September</h2>
        <span class="year-chip" id="event-year-chip">2026</span>
      </div>

      <div class="event-visual">
        <div class="date-tile" aria-label="Event date">
          <span id="date-value">22</span>
          <small>Date</small>
        </div>
        <div class="image-frame">
          <img id="card-img" src="fruit_basket.jpg" alt="Ekadashi illustration">
        </div>
      </div>

      <div class="event-copy">
        <h3 id="type-value">જલઝીલણી એકાદશી</h3>
        <p id="day-value">Tuesday</p>
      </div>

      <div class="card-controls" aria-label="Browse dates">
        <button id="prev-button" type="button" onclick="previous()" aria-label="Previous date">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
        <span>Swipe or tap</span>
        <button id="next-button" type="button" onclick="forward()" aria-label="Next date">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg>
        </button>
      </div>
    </section>

    <section class="countdown-card" aria-live="polite">
      <span>Countdown</span>
      <strong id="days-remaining">—</strong>
    </section>

    <section class="panel audio-panel">
      <div class="panel-heading"><h2>Dada Sattu</h2></div>
      <audio id="myAudio" controls preload="none"><source src="Dada Sattu.mp3"></audio>
    </section>

    <p class="today-line">Today is <strong><span id="cur-day">—</span> <span id="cur-mon">—</span>, <span id="cur-yr">—</span></strong></p>
  </main>

  <script src="scriptE.js?v=4"></script>
</body>
</html>
